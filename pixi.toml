# --- Coverage assurance system. See docs/binding-coverage.md ---
probe-ffi-callback = "pixi run gen-test-wav && mkdir -p build/probes && cc -O2 -fPIC -shared -o build/probes/libprobe_cb.so tools/probes/ffi_callback/probe_cb.c -lpthread && cc -O2 -fPIC -shared -o build/probes/libprobe_dec.so tools/probes/ffi_callback/probe_dec.c vendor/miniaudio/miniaudio.c -Ivendor/miniaudio -lpthread -lm -ldl -latomic && mojo run tools/probes/ffi_callback/p1.mojo && mojo run tools/probes/ffi_callback/p2.mojo && mojo run tools/probes/ffi_callback/p3.mojo && mojo run tools/probes/ffi_callback/p4.mojo"
check-codec-layout = "cc -fsyntax-only -w tools/check_codec_layout.c -Ivendor/miniaudio -Isrc/native"
check-enum-values = "python3 tools/check_enum_values.py"
gen-api-inventory = "python3 tools/gen_api_inventory.py"
coverage-binding = "python3 tools/check_binding_coverage.py"
coverage-shim = "bash tools/shim_coverage.sh"
coverage = "pixi run coverage-binding && pixi run coverage-shim"
gate = "pixi run test && pixi run coverage"

gen-test-wav = "python3 tools/gen_test_wav.py"

[dependencies]
mojo = ">=1.2.0,<2"

# --- WebAssembly: see README "Browser (WebAssembly)" and wasm.toml ---
# `wasm`: LLVM 23 (clang / opt / llc / wasm-ld) and Node 24 (memory64 / table64) plus the
# ludens-wasm-rt build driver, which reads wasm.toml. A dev dependency only: the default
# environment and the native builds never touch it.
[feature.wasm.dependencies]
python = ">=3.11"
clang = "23.1.4.*"
lld = "23.1.4.*"
llvm-tools = "23.1.4.*"
nodejs = "24.*"

[feature.wasm.pypi-dependencies]
ludens-wasm-rt = { git = "https://github.com/Hundo1018/ludens-wasm-rt", rev = "226728d" }

[feature.wasm.tasks]
build-wasm = "pixi run -e default gen-test-wav && python3 -m ludens_wasm_rt.build_wasm --lib . examples/web/audio.mojo -I examples/web -o build/wasm/audio.wasm --export 'web_*'"
test-wasm = "pixi run -e default gen-test-wav && python3 tools/wasm/test_wasm.py"
web = "pixi run build-wasm && python3 examples/web/serve.py"

[environments]
wasm = ["wasm"]
